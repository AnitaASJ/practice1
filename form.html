<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            background-color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        header{
            background-color: purple;
            position: fixed;
            width: 100%;
            padding: 30px 40px;
        }

        .navbar-section{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo{
            color: #ffffff;
            text-decoration: none;
        }

        .nav-list{
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-item{
            text-decoration: none;
            color: #ffffff;
            border-radius: 50px;
            padding: 10px 20px;
        }

        .nav-item:hover{
            color: black;
            background-color: #ffffff;
            transition: 0.3s ease;
        }
        
        section{
            padding: 130px 20px;
        }

        .contact-section{
            gap: 30px;
        }

        .main-title{
            text-align: center;
            padding-bottom: 20px;
        }

        .form-section{
            display: flex;
            justify-content: center;
            padding: 30px;
        }

       form{
        width: 450px;
        

       }

       input{
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        cursor: pointer;
       }

       input:focus{
        outline: none;
        border: 2px solid purple;
        box-shadow: 0 2px 8px purple;
       }

       input[type="radio"]{
        width: auto;
        accent-color: purple;
        cursor: pointer;
        margin-left: 10px;
       }

       input[type="checkbox"]{
       width: auto;
       accent-color: purple;
       cursor: pointer;
       }

       select{
        width: 100%;
        padding: 12px;
        margin-bottom: 8px;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 8px;
       }
       
       select:focus{
        outline: none;
        border: 2px solid purple;
        box-shadow: 0 2px 8px purple;
       }

       p{
        font-weight: 600;
        font-size: 15px;
        margin-bottom: 20px;
       }
       

    </style>
</head>
<body>
    <header>
        <nav class="navbar-section">
            <a class="nav-logo" href="#home">
                <h2 class="logo-text">Brave</h2>
            </a>
            <ul class="nav-list">
                <li>
                    <a class="nav-item" href="#home">Home</a>
                </li>
                <li>
                    <a class="nav-item" href="#about">About</a>
                </li>
                <li>
                    <a class="nav-item" href="#Contact">Contact</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
    <section>
        <div class="contact-section">
        <h2 class="main-title">ISBAT University</h2>
        <div class="form-section">
        <form action="#" method="post">
            <p> <label for="name">Name</label> 
                <input type="text" name="name">
             </p>
            <p>
                <label for="id">Student ID</label> 
                <input type="text" name="id" required> 
            </p>
             <p> 
                <label for="email">Email Address</label>
                <input type="email" name="email"> 
            </p>
              <p>
                <label for="phone">Phone Number</label>
                 <input type="text" name="phone" placeholder="07XXXXXXXX"> 
                </p>
              <b>Gender</b>
              <P> <label>Female</label>
                 <input type="radio" name="gender" value="female">
                 </P>
              <P> 
                <label>Male</label>
                <input type="radio" name="gender" value="male"> 
            </P>
              <p>Country<select name="country"> <Option Value="">Select Nationality
          </option>
          </p>
          <option value="ug">Uganda</option>
          <option value="k">Kenya</option>
          <option value="tz">Tanzania</option>
          <option value="Rw">Rwanda</option>
          <option value="ss">South Sudan</option>
        </Select>
        
          <p> Program of study
            <select name="programme"> <Option Value="">Select Programme
          </option>
          </p>
          <option value="bcs">Bachelor of Computer Science</option>
          <option value="bit">Bachelor of Information Technology</option>
          <option value="bai">Bachelor of Artificial Intelligence</option>
          <option value="dit">Diploma in Information Technology</option>
        </select>

          <p> 
            <label for="dob">Date Of Birth</label>
             <input type="date" name="dob"> 
            </p>

          <b>Course Units</b>
          <p>
            <label>Data Structures</label> 
            <input type="checkbox" name="course" value="dsa">
         </p>
           <p>
            <label>Computer Architecture </label>
            <input type="checkbox" name="course" value="ca"> </p>
            <p>
                <label>C programming</label>
                 <input type="checkbox" name="course" value="cp">
                 </p>
             <p>
                <label>Java programming</label> 
                <input type="checkbox" name="course" value="jp"> 
            </p>
        </form>
        </div>
        </div>
    </section>
    </main>
</body>
</html>
